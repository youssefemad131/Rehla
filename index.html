:root{--bg:#faf6f3;--card:#fff;--tx:#2b1d1b;--mut:#8a7773;--bd:#e8dcd6;--pri:#b4231f;--dk:#8f1d1a;--ok:#2e7d4f;--wt:#b86e00;--chip:#f6ebe6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
#app{padding:0 14px}
.top{background:var(--dk);color:#fff;margin:0 -14px 14px;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.top small{opacity:.75;font-size:13px}
.top h2{margin:0;font-size:21px;line-height:1.3}
.top button{background:none;border:1.5px solid #ffffff88;color:#fff;border-radius:8px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
input[type=text],input[type=number],input:not([type]),select{font:inherit;font-size:16px;padding:11px 12px;border:1.5px solid var(--bd);border-radius:9px;width:100%;margin:5px 0;background:#fff;color:var(--tx);outline:none}
input:focus,select:focus{border-color:var(--pri)}
.btn{font:inherit;font-size:16px;font-weight:700;padding:12px;border:0;border-radius:9px;width:100%;margin:5px 0;background:var(--pri);color:#fff;display:block;text-align:center}
.btn.g{background:var(--ok)}.btn.d{background:#444}.btn.s{background:var(--chip);color:var(--dk)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.m{color:var(--mut);font-size:13px}.c{text-align:center;padding:18px}
.stats{display:flex;padding:0}
.stats div{flex:1;text-align:center;padding:12px 4px;border-inline-start:1px solid var(--bd)}
.stats div:first-child{border:0}
.stats b{display:block;font-size:24px;color:var(--pri)}.stats span{font-size:12.5px;color:var(--mut)}
.bar{height:6px;background:var(--chip);border-radius:3px;margin:0 14px 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri)}
.stg{display:flex;flex-wrap:wrap;gap:8px}
.stg button{flex:1 0 76px;font:inherit;border:1.5px solid var(--bd);background:#fff;border-radius:10px;padding:8px 4px;color:var(--tx)}
.stg button b{display:block;font-size:22px;color:var(--pri)}.stg button span{font-size:12.5px;color:var(--mut)}
.stg button.on{background:var(--pri);border-color:var(--pri)}.stg button.on b,.stg button.on span{color:#fff}
.pills{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;font:inherit;font-size:14px;font-weight:600;padding:7px 13px;border-radius:8px;border:1.5px solid var(--bd);background:#fff;color:var(--mut)}
.pills button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.kc.ok{border-inline-start:5px solid var(--ok)}.kc.wait{border-inline-start:5px solid var(--wt)}
.kr{display:flex;align-items:center;gap:13px}
.kn{flex:1;font-weight:600;font-size:16px;line-height:1.35}
.st{font-size:13px;font-weight:600;color:var(--mut)}.kc.ok .st{color:var(--ok)}.kc.wait .st{color:var(--wt)}
.cb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border:2px solid #c4b0a9;border-radius:8px;background:#fff;flex:none;margin:0;position:relative}
.cb:checked{background:var(--pri);border-color:var(--pri)}
.cb:checked:after{content:"";position:absolute;left:9px;top:3px;width:7px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.ch{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;padding-top:11px;border-top:1px dashed var(--bd)}
.ch button{font:inherit;font-size:14px;font-weight:600;padding:7px 12px;border-radius:8px;border:1.5px solid var(--bd);background:#fff;color:var(--tx)}
.ch button.a{background:var(--wt);border-color:var(--wt);color:#fff}
.ch button.a.g{background:var(--ok);border-color:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;border-top:3px solid transparent}
nav button.on{color:var(--pri);border-top-color:var(--pri)}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}.item .n{flex:1;font-weight:600}
.item input{width:84px;margin:0;padding:7px 8px;font-size:15px;text-align:center}
.x{background:none;border:0;color:var(--pri);font-size:24px;padding:0 8px;line-height:1}
.tag{font-size:12.5px;background:var(--chip);color:var(--dk);padding:2px 10px;border-radius:6px;font-weight:700}
ul.nl{list-style:none;margin:6px 0 0;padding:0}
ul.nl li{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
ul.nl li:last-child{border:0}
.nm{font-weight:600}
.gr{font-weight:400;color:var(--mut);font-size:13px}
.via{font-size:12px;color:var(--ok);font-weight:600;margin-inline-start:auto}
.dl{margin-top:8px}
.svh{cursor:pointer;margin:0!important;gap:8px;-webkit-user-select:none;user-select:none}
.svh .nmx{flex:1;min-width:0}
.svh .tags{display:flex;align-items:center;gap:6px;flex:none}
.svh .tag.rm{background:#fdeceb;color:var(--pri)}.svh .tag.rm.z{background:#eaf6ee;color:var(--ok)}
.svh .chev{display:inline-block;font-size:15px;color:var(--dk);transition:transform .2s;transform:rotate(180deg)}
.svh.op .chev{transform:none}
.svb{margin-top:10px}
.dr{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.dr:last-child{border:0}
.dr .nm{font-size:16px}
.dr.dn .nm{text-decoration:line-through;text-decoration-thickness:2px;color:var(--mut)}
.dr.dn .gr{opacity:.7}
.sb{position:relative}
.sb input{padding-inline-end:46px}
.sb .cl{position:absolute;inset-inline-end:5px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:50%;background:var(--chip);color:var(--dk);font-size:24px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.sb .cl[hidden]{display:none}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:#2b1d1b;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#ts.on{opacity:1}
body.sm #ts{bottom:calc(168px + env(safe-area-inset-bottom))}
label.kc{display:block}
.kc.sl{border-color:var(--pri);background:var(--chip)}
.cb.r{border-radius:50%}
body.sm{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
#bb{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));padding:18px 14px 8px;background:linear-gradient(transparent,var(--bg) 40%);z-index:9;display:none}
#bb.on{display:block}
#bb .btn{margin:0;box-shadow:0 2px 10px #0003}
.btn:disabled{opacity:.5}
.bkn{border-color:var(--wt);background:#fff7e8}
details summary{cursor:pointer;font-weight:600;color:var(--dk);padding:6px 0}
.mo{display:flex;gap:8px;text-align:center;margin:8px 0}
.mo div{flex:1;background:var(--chip);border-radius:9px;padding:7px 4px;font-size:12.5px;color:var(--mut)}
.mo b{display:block;font-size:17px;color:var(--tx)}
.mo input{margin:2px 0 0;padding:4px;text-align:center;font-weight:700;font-size:16px}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t td,table.t th{padding:8px 4px;text-align:center;border-bottom:1px solid var(--bd)}
table.t th{color:var(--mut);font-weight:600;font-size:13px}
.pb{flex:none;max-width:46%;font:inherit;font-size:13.5px;font-weight:700;padding:8px 10px;border-radius:8px;border:1.5px solid;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb.a{color:var(--wt);border-color:var(--wt);background:#fff7e8}
.pb.g{color:var(--ok);border-color:var(--ok);background:#eaf6ee}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;font:inherit;font-size:17px;font-weight:600;padding:15px 14px;margin-bottom:8px;border:1.5px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);text-align:start}
.opt.cur{border-color:var(--pri);background:var(--chip);color:var(--dk)}
.opt b{color:var(--pri)}
.item select{width:132px;margin:0;padding:7px 6px;font-size:14px}
.acct-kids{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.acct-kids button{font:inherit;font-size:13px;padding:8px 10px;border:1.5px solid var(--bd);border-radius:9px;background:#fff;color:var(--tx)}
.acct-kids button.done{background:#eaf6ee;border-color:var(--ok);color:var(--ok);font-weight:700}
.acct-note{font-size:12px;color:var(--mut);margin-top:7px}
#md{position:fixed;inset:0;background:#0008;z-index:30;display:none;align-items:flex-end}
#md.on{display:flex}
#md .sh{background:var(--bg);width:100%;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}

<script>
const K='churchTripsV1';
let D;try{D=JSON.parse(localStorage.getItem(K)||'null')}catch(e){D=null}
if(!D)D={trips:[],cur:null,kids:[],sv:[{id:'me',name:'يوسف عماد'}]};
D.trips.forEach(t=>{t.subs=t.subs||{};t.got=t.got||{};t.delivered=t.delivered||{};t.att=t.att||{};for(const k in t.subs){const v=t.subs[k];if(typeof v==='string')t.subs[k]={paid:!!v,sv:v}}});
const me0=D.sv.find(x=>x.id==='me');if(me0&&me0.name==='يوسف (أنا)')me0.name='يوسف عماد';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}if(typeof SY!=='undefined')SY.push()};
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nz=s=>String(s==null?'':s).toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim();
const nm=(name,qq)=>{const t=nz(qq);if(!t)return true;const n=nz(name);return t.split(' ').every(x=>n.includes(x))};
const T=()=>D.trips.find(t=>t.id===D.cur);
const svName=id=>{const s=D.sv.find(x=>x.id===id);return s?s.name:'—'};
const fm=n=>(Math.round(n*100)/100).toLocaleString('ar-EG');
const GR=['حضانة','أولى ابتدائي','تانية ابتدائي','تالتة ابتدائي','رابعة ابتدائي','خامسة ابتدائي','سادسة ابتدائي'];
const NA='بدون صف';
const ak=k=>String(k.age==null?'':k.age).trim();
const ag=k=>ak(k)||NA;
const alb=k=>ak(k);

function stages(t){

function stats(t){

 const go=D.kids.filter(k=>t.subs[k.id]);

 const meR=rows.find(r=>r.s.id==='me'),mine=sortKids((meR?meR.ks:[]).concat(D.kids.filter(k=>via[k.id])));

function vSum(){
 const t=T(),S=stats(t),ST=stages(t),p=t.price||0,dl=t.delivered||{},oth=S.rows.filter(r=>r.s.id!=='me');
 const all=S.rows.reduce((a,r)=>a+r.owed,0),rem=oth.reduce((a,r)=>a+r.rem,0);
 const extra=oth.reduce((a,r)=>a+(+(t.got[r.s.id]||0)),0),inHand=S.mine.length*p+extra;
 let h=hdr('الحساب',t.name)+bkBanner()+`<div class="card" style="padding:0"><div class="stats"><div><b>${fm(all)}</b><span>إجمالي المدفوع</span></div><div><b>${fm(inHand)}</b><span>معايا أنا</span></div><div><b>${fm(rem)}</b><span>لسه عند الخدام</span></div></div></div>
 <div class="card"><h3 class="svh${MYO?' op':''}" onclick="tgMy(this)"><span class="nmx">اللي دفعوا ليا</span><span class="tags"><span class="tag">${S.mine.length} طفل</span><span class="tag">${fm(S.mine.length*p)}</span><span class="chev">▲</span></span></h3><div class="svb" id="myb"${MYO?'':' hidden'}></div></div>`;
 oth.forEach(r=>{
  if(!r.ks.length&&!r.got)return;
  const op=!!SVO[r.s.id];
  h+=`<div class="card"><h3 class="svh${op?' op':''}" data-sv="${r.s.id}" onclick="tgSv(this,'${r.s.id}')"><span class="nmx">${esc(r.s.name)}</span><span class="tags"><span class="tag">${r.ks.length} طفل</span><span class="tag rm${r.rem>0?'':' z'}">${r.rem>0?'متبقي '+fm(r.rem):'خالص'}</span><span class="chev">▲</span></span></h3>
  <div class="svb"${op?'':' hidden'}>
  <div class="mo"><div>المطلوب<b>${fm(r.owed)}</b></div><div>وصلني منك<b>${fm(r.got)}</b></div><div>المتبقي<b style="color:${r.rem>0?'#b4231f':'#2e7d4f'}">${fm(r.rem)}</b></div></div>
  <div class="acct-note">علّم على الطفل لما الخادم يسلّمك فلوسه، هيتشطب هنا وينتقل لقائمة «اللي دفعوا ليا».</div>
  ${r.ks.length?`<button class="btn ${r.ks.every(k=>dl[k.id])?'s':'g'}" style="margin:2px 0 4px" onclick="delAll('${r.s.id}')">${r.ks.every(k=>dl[k.id])?'إلغاء تحديد الكل':'تحديد الكل — استلمت فلوسهم كلهم'}</button>`:''}
  <div class="dl">${r.ks.length?sortKids(r.ks).map(k=>{const d=dl[k.id];return `<label class="dr${d?' dn':''}" data-k="${k.id}"><input type="checkbox" class="cb" ${d?'checked':''} onchange="toggleDelivered('${k.id}')"><span class="nm">${esc(k.name)}</span><span class="gr">${esc(alb(k))}</span></label>`}).join(''):'<div class="m">لسه مفيش.</div>'}</div>
  <div class="acct-note" style="margin-top:12px">تسوية إضافية / مبلغ يدوي (اختياري)</div><input type="number" inputmode="decimal" value="${t.got[r.s.id]||''}" placeholder="مبلغ إضافي" onchange="setGot('${r.s.id}',this.value)"></div></div>`;
 });
 h+=`<div class="card"><h3>حسب الصف</h3>${ST.length?`<table class="t"><tr><th>الصف</th><th>رايحين</th><th>دفعوا</th><th>لسه</th></tr>${ST.map(s=>`<tr><td>${esc(s.a)}</td><td><b>${s.go}</b></td><td>${s.paid}</td><td>${s.go-s.paid}</td></tr>`).join('')}<tr><td><b>الإجمالي</b></td><td><b>${S.go.length}</b></td><td><b>${S.go.length-S.unp.length}</b></td><td><b>${S.unp.length}</b></td></tr></table>`:'<div class="m">لسه محدش اتحدد.</div>'}</div>`;
 h+=`<div class="card"><h3>لسه مدفعوش <span class="tag">${S.unp.length}</span></h3><details><summary>عرض الأسماء</summary>${nlist(S.unp)}</details></div>
 <div class="card"><h3>تصدير PDF</h3>
 <button class="btn" onclick="pdfAttend()">حضور الرحلة</button>
 <button class="btn" onclick="pdfAll()">كل الرايحين</button>
 <button class="btn" onclick="pdfSv('me')">اللي دفعوا معايا أنا</button>
 <button class="btn" onclick="pdfOthers()">اللي دفعوا لخدام تانيين</button>
 <button class="btn" onclick="pdfUnp()">اللي لسه مدفعوش</button>
 <button class="btn" onclick="pdfStages()">الرايحين حسب الصف</button>
 <button class="btn" onclick="pdfSum()">ملخص الحساب</button>
 <div class="m">هيفتح شاشة الطباعة، اختار «حفظ كـ PDF».</div></div>`;
 $('app').innerHTML=h;drawMy();
}
function setGot(id,v){T().got[id]=+v||0;save();vSum()}
function tgMy(h){MYO=!MYO;h.classList.toggle('op',MYO);h.nextElementSibling.hidden=!MYO}
function drawMy(){
 const e=$('myb');if(!e)return;const S=stats(T()),via=S.via,all=S.mine,dir=all.filter(k=>!via[k.id]),vi=all.filter(k=>via[k.id]);
 const L=MYF==='dir'?dir:MYF==='via'?vi:all;
 e.innerHTML=`<div class="pills" style="padding-bottom:4px">${[['all','الكل',all.length],['dir','دفعوا ليا',dir.length],['via','اتحوّلوا من خدام',vi.length]].map(p=>`<button class="${MYF===p[0]?'on':''}" onclick="MYF='${p[0]}';drawMy()">${p[1]} ${p[2]}</button>`).join('')}</div>${nlist(L,via)}`;
}
function delAll(id){
 const t=T(),S=stats(t),r=S.rows.find(x=>x.s.id===id);if(!r||!r.ks.length)return;
 t.delivered=t.delivered||{};
 const sel='[data-sv="'+id+'"]',el=document.querySelector(sel),top=el?el.getBoundingClientRect().top:0;
 const all=r.ks.every(k=>t.delivered[k.id]);
 r.ks.forEach(k=>{if(all)delete t.delivered[k.id];else t.delivered[k.id]=true});
 save();vSum();
 const n=document.querySelector(sel);if(n&&el)scrollBy(0,n.getBoundingClientRect().top-top);
 toast(all?'اتلغى تحديد '+r.ks.length+' طفل':'تم استلام '+r.ks.length+' طفل من '+r.s.name);
}
function tgSv(h,id){SVO[id]=!SVO[id];h.classList.toggle('op',SVO[id]);h.nextElementSibling.hidden=!SVO[id]}
function toggleDelivered(id){
 const t=T();t.delivered=t.delivered||{};
 const sel='[data-k="'+id+'"]',el=document.querySelector(sel),top=el?el.getBoundingClientRect().top:0;
 if(t.delivered[id])delete t.delivered[id];else t.delivered[id]=true;
 save();vSum();
 const n=document.querySelector(sel);if(n&&el)scrollBy(0,n.getBoundingClientRect().top-top);
}

const CHURCH='كنيسة مارجرجس الباجور';
const hi=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const ATT_FRAME='<svg viewBox="0 0 595.28 841.89"><path d="M38.1 28.3V36.3H30.1V32.3H34.1V40.3H26.1V801.5H34.1V809.5H30.1V805.5H38.1V813.5H558.6V805.5H566.6V809.5H562.6V801.5H570.6V40.3H562.6V32.3H566.6V36.3H558.6V28.3Z" fill="none" stroke="#737578" stroke-width="4" stroke-linejoin="miter"/></svg>';
/* ورقة 1: حضانة + أولى + تانية | ورقة 2: تالتة → سادسة (خدمة منفصلة) | ورقة 3: بدون صف (لو فيه) */
const GRP_LBL=['حضانة · أولى · تانية','تالتة · رابعة · خامسة · سادسة','بدون صف'];
function attGroups(ks){const g=[[],[],[]];ks.forEach(k=>{const i=stageIndex(k);g[i<=2?0:i<=6?1:2].push(k)});return g.map((a,gi)=>({gi,ks:a})).filter(x=>x.ks.length)}
const stEnd=(a,i)=>!a[i+1]||ag(a[i+1])!==ag(a[i]);
function pdfAttend(){
 const t=T(),S=stats(t),ks=sortKids(S.go);
 if(!ks.length){toast('مفيش أطفال رايحين لسه');return}
 const PER=24;
 const col=(cls,arr,from)=>{let r='';for(let i=from;i<from+PER;i++){const k=arr[i];r+=`<div class="rw${k&&stEnd(arr,i)?' se':''}"><div class="n">${hi(i+1)}</div><div class="nm">${k?esc(k.name):''}</div><div><i class="cb"></i></div></div>`}
  return `<div class="tb ${cls}"><div class="th"><div>م</div><div>الإســـــــــــــــم</div><div>حضور</div></div><div class="tbd">${r}</div></div>`};
 let h='';
 attGroups(ks).forEach(G=>{const pages=Math.ceil(G.ks.length/(PER*2));
  for(let p=0;p<pages;p++){const b=p*PER*2;
   h+=`<div class="ap">${ATT_FRAME}<img class="wm" src="${ATT_IMG}" alt="">${col('r',G.ks,b)}${col('l',G.ks,b+PER)}<div class="ttl"><span>${esc(t.name||'')}</span></div><div class="ft"><span>${esc(CHURCH)}</span></div></div>`}});
 $('pa').innerHTML=h;document.body.classList.add('pr','att');
 const st=document.createElement('style');st.id='pgs';st.textContent='@page{size:A4;margin:0}';document.head.appendChild(st);
 const fit=()=>{try{const c=document.createElement('canvas').getContext('2d');c.font='56px PalestineF';const w=c.measureText(t.name||'').width,max=500*96/72;if(w>max)document.querySelectorAll('.ap .ttl span').forEach(e=>e.style.fontSize=Math.max(14,42*max/w)+'pt')}catch(e){}};
 const go=()=>{fit();setTimeout(()=>window.print(),200)};
 try{Promise.all(['26pt GEJarida','14pt HacenLiner','20pt VIPSamir','42pt PalestineF','21pt AdobeArabicN'].map(f=>document.fonts.load(f,'مح١'))).then(go,go)}catch(e){go()}
}
window.onafterprint=()=>{document.body.classList.remove('pr','att');const e=$('pgs');if(e)e.remove()};
const tbl=(h,r)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
const stt=(t,k)=>t.subs[k.id].paid?'دفع لـ '+esc(svName(t.subs[k.id].sv)):'لسه مدفعش';
function pdfAll(){const t=T(),S=stats(t);pdf(t.name+' — الرايحين ('+S.go.length+')',tbl(['#','الاسم','الصف','الحالة'],S.go.map((k,i)=>[i+1,esc(k.name),esc(ak(k)),stt(t,k)])))}
function pdfSv(id){const t=T(),S=stats(t),r=S.rows.find(x=>x.s.id===id),me=id==='me',ks=me?S.mine:r.ks,ow=me?ks.length*(t.price||0):r.owed;pdf(t.name+' — '+r.s.name+' ('+ks.length+')',tbl(['#','الاسم','الصف'],ks.map((k,i)=>[i+1,esc(k.name),esc(ak(k))]))+`<p>المطلوب: ${fm(ow)}${me?'':' — المستلم: '+fm(r.got)+' — المتبقي: '+fm(r.rem)}</p>`)}
function pdfOthers(){const t=T(),S=stats(t);const o=S.go.filter(k=>t.subs[k.id].paid&&t.subs[k.id].sv!=='me');pdf(t.name+' — دفعوا لخدام تانيين ('+o.length+')',tbl(['#','الاسم','الصف','دفع لـ'],o.map((k,i)=>[i+1,esc(k.name),esc(ak(k)),esc(svName(t.subs[k.id].sv))])))}
function pdfUnp(){const t=T(),S=stats(t);pdf(t.name+' — لسه مدفعوش ('+S.unp.length+')',tbl(['#','الاسم','الصف'],S.unp.map((k,i)=>[i+1,esc(k.name),esc(ak(k))])))}
function pdfStages(){const t=T(),ST=stages(t),n=ST.reduce((a,s)=>a+s.go,0);pdf(t.name+' — الرايحين حسب الصف',tbl(['الصف','رايحين','دفعوا','لسه'],ST.map(s=>[esc(s.a),s.go,s.paid,s.go-s.paid]))+`<p>الإجمالي: ${n}</p>`)}
function pdfSum(){const t=T(),S=stats(t);pdf(t.name+' — ملخص الحساب',tbl(['الخادم','العدد','المطلوب','المستلم','المتبقي'],S.rows.filter(r=>r.ks.length||r.got).map(r=>[esc(r.s.name),(r.s.id==='me'?S.mine.length:r.ks.length),fm(r.s.id==='me'?S.mine.length*(t.price||0):r.owed),r.s.id==='me'?'—':fm(r.got),r.s.id==='me'?'—':fm(r.rem)]))+`<p>لسه مدفعوش: ${S.unp.length}</p>`)}
